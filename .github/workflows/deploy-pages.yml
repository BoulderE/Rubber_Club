name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
                    
      - name: Install deps
        run: npm ci
        working-directory: rubber-club-vue

      - name: Build
        env:
          VITE_API_BASE: "https://semipneumatically-expositorial-margert.ngrok-free.dev"
          VITE_BASE: "/Rubber_Club/"
        run: npm run build
        working-directory: rubber-club-vue

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rubber-club-vue/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
